<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --navy:#1d2633; --navy2:#39404c; --navy3:#55606c; --mist:#c9ced6; --red:#77121b; --red2:#a65b5c; --rose:#ddb8b8; --sand:#fdcda2; --gold:#c39b53; --white:#fff; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--navy); font-family: Outfit, sans-serif; color: var(--white); }
  canvas { position: absolute; inset: 0; }
  .layer { position: absolute; inset: 0; }
  .brand { position: absolute; left: 60px; top: 48px; background: #fff; border-radius: 18px; padding: 14px 26px; display: flex; align-items: center; gap: 20px; border-bottom: 5px solid var(--red); }
  .brand img.m { height: 58px; } .brand img.a { height: 66px; }
  .brand .div { width: 2px; height: 56px; background: #e4e6e8; }
  .chap { position: absolute; right: 60px; top: 56px; text-align: right; font-family: Oswald; letter-spacing: .14em; }
  .chap .k { color: var(--sand); font-size: 26px; }
  .chap .y { font-size: 64px; font-weight: 600; line-height: 1; margin-top: 4px; }
  .ticker { position: absolute; left: 0; right: 0; bottom: 0; height: 74px; background: var(--red); display: flex; align-items: center; overflow: hidden; }
  .ticker .lbl { background: var(--sand); color: var(--navy); font-family: Oswald; font-weight: 600; letter-spacing: .12em; font-size: 28px; height: 100%; display: flex; align-items: center; padding: 0 30px; z-index: 2; flex: none; }
  .ticker .run { white-space: nowrap; font-size: 28px; font-weight: 500; padding-left: 40px; will-change: transform; }
  .cap { position: absolute; left: 160px; right: 160px; bottom: 104px; text-align: center; font-size: 34px; line-height: 1.35; color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
  .cap.small { font-size: 30px; }
  .cap span { background: rgba(29,38,51,.72); padding: 6px 16px; border-radius: 10px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  /* travel */
  .travel { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-bottom: 120px; }
  .travel .sub { font-family: Oswald; letter-spacing: .3em; color: var(--sand); font-size: 36px; }
  .travel .num { font-family: Oswald; font-weight: 700; font-size: 340px; line-height: 1; letter-spacing: .02em; }
  .travel .ttl { font-size: 72px; font-weight: 600; color: var(--sand); margin-top: 10px; }
  /* news */
  .news { display: grid; grid-template-columns: 1fr 560px; align-items: center; gap: 60px; padding: 200px 120px 220px; }
  .news .kick { display: inline-block; background: var(--red); color: #fff; font-family: Oswald; letter-spacing: .16em; font-size: 30px; padding: 8px 22px; border-radius: 8px; text-transform: uppercase; }
  .news .dt { font-family: Oswald; letter-spacing: .14em; color: var(--sand); font-size: 28px; margin-left: 18px; }
  .news .head { font-size: 92px; font-weight: 600; line-height: 1.05; margin: 30px 0 26px; letter-spacing: -0.01em; }
  .news .sub2 { font-size: 40px; color: var(--mist); line-height: 1.3; }
  .news .iconbox { width: 560px; height: 560px; border-radius: 40px; background: rgba(57,64,76,.55); border: 2px solid var(--navy3); display: grid; place-items: center; }
  .news svg { width: 440px; height: 440px; overflow: visible; }
  .draw { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  /* title */
  .title { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-bottom: 120px; }
  .title .big { font-family: Oswald; font-weight: 700; font-size: 230px; line-height: 1; letter-spacing: .02em; }
  .title .big span { color: var(--sand); }
  .title .tag { font-size: 54px; color: var(--mist); margin-top: 24px; }
  /* learn */
  .learn { display: grid; grid-template-columns: 1fr 520px; align-items: center; gap: 60px; padding: 150px 120px 300px; }
  .learn .kick { display: inline-block; background: var(--red); color: #fff; font-family: Oswald; letter-spacing: .16em; font-size: 28px; padding: 8px 22px; border-radius: 8px; text-transform: uppercase; }
  .learn .head { font-size: 76px; font-weight: 600; line-height: 1.06; margin: 24px 0 18px; }
  .learn .sub2 { font-size: 38px; color: var(--mist); line-height: 1.3; }
  .learn .ex { margin-top: 30px; background: rgba(253,205,162,.1); border-left: 8px solid var(--sand); border-radius: 14px; padding: 22px 28px; font-size: 36px; line-height: 1.32; }
  .learn .ex b { display: block; font-family: Oswald; font-weight: 500; letter-spacing: .14em; color: var(--sand); font-size: 24px; margin-bottom: 6px; }
  .learn .iconbox { width: 520px; height: 520px; border-radius: 40px; background: rgba(57,64,76,.55); border: 2px solid var(--navy3); display: grid; place-items: center; }
  .learn svg { width: 410px; height: 410px; overflow: visible; }
  /* grid of investments */
  .grid { display: flex; flex-direction: column; padding: 170px 120px 300px; }
  .grid .kick { display: inline-block; align-self: flex-start; background: var(--red); color: #fff; font-family: Oswald; letter-spacing: .16em; font-size: 28px; padding: 8px 22px; border-radius: 8px; text-transform: uppercase; }
  .grid .head { font-size: 70px; font-weight: 600; line-height: 1.06; margin: 20px 0 30px; }
  .grid .cards { display: grid; gap: 22px; }
  .grid .card { background: rgba(57,64,76,.6); border: 2px solid var(--navy3); border-radius: 22px; padding: 26px 28px; }
  .grid .card .n { display: flex; align-items: center; gap: 14px; font-size: 38px; font-weight: 700; }
  .grid .card .n i { width: 22px; height: 22px; border-radius: 6px; display: inline-block; }
  .grid .card p { font-size: 30px; color: var(--mist); line-height: 1.3; margin-top: 10px; }
  /* enter */
  .enter { display: grid; grid-template-columns: 560px 1fr; gap: 90px; align-items: center; padding: 170px 140px 200px; }
  .enter .qrbig { background: #fff; border-radius: 34px; padding: 30px; border-top: 12px solid var(--red); }
  .enter .qrbig img { width: 100%; display: block; image-rendering: pixelated; }
  .enter .k { font-family: Oswald; letter-spacing: .2em; color: var(--sand); font-size: 40px; }
  .enter .h { font-size: 104px; font-weight: 700; line-height: 1.02; margin: 14px 0 30px; }
  .enter ol { font-size: 40px; line-height: 1.55; padding-left: 50px; color: var(--white); }
  .enter .url { margin-top: 26px; font-size: 30px; color: var(--sand); word-break: break-all; }
  /* corner QR */
  .cqr { position: absolute; right: 48px; bottom: 98px; width: 220px; background: #fff; border-radius: 18px; padding: 12px 12px 8px; text-align: center; border-top: 6px solid var(--red); display: none; }
  .cqr img { width: 100%; display: block; image-rendering: pixelated; }
  .cqr b { display: block; font-family: Oswald; color: var(--navy); letter-spacing: .12em; font-size: 22px; margin-top: 4px; }
  .cap.withqr { right: 300px; left: 120px; }
  /* close */
  .close { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 120px 200px 220px; }
  .close .its { font-family: Oswald; letter-spacing: .2em; color: var(--sand); font-size: 40px; }
  .close .q { font-size: 96px; font-weight: 600; line-height: 1.08; margin: 26px 0 50px; }
  .close .scan { display: inline-flex; align-items: center; gap: 30px; background: var(--sand); color: var(--navy); font-weight: 700; font-size: 56px; padding: 26px 54px; border-radius: 999px; }
  .close .scan svg { width: 80px; height: 80px; }
</style></head>
<body>
<canvas id="bg" width="1920" height="1080"></canvas>
<div class="layer" id="scene"></div>
<div class="brand"><img class="m" src="mazi-logo.svg"><span class="div"></span><img class="a" src="mazi-20-years.svg"></div>
<div class="chap"><div class="k" id="chapK"></div><div class="y" id="chapY"></div></div>
<div class="cap" id="cap"></div>
<div class="cqr" id="cqr"><img id="cqrImg" alt=""><b>SCAN TO ENTER</b></div>
<div class="ticker"><div class="lbl">FUTURE NEWS</div><div class="run" id="run"></div></div>
<script>
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const out = (x) => 1 - Math.pow(1 - clamp(x), 3);
let CFG, cur = -1, parts = {};
const bg = document.getElementById("bg"), ctx = bg.getContext("2d");
// seeded particles
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const P = Array.from({ length: 90 }, () => ({ x: rnd() * 1920, y: rnd() * 1080, r: 1 + rnd() * 3, s: 8 + rnd() * 30, a: .15 + rnd() * .35 }));
const STREAKS = Array.from({ length: 160 }, () => ({ ang: rnd() * Math.PI * 2, d: rnd(), sp: .4 + rnd(), w: 1 + rnd() * 3 }));

const ICONS = {
  chip: (p, t) => `<rect class="draw" x="50" y="50" width="100" height="100" rx="14" pathLength="1" stroke="var(--sand)" stroke-width="6" stroke-dasharray="1" stroke-dashoffset="${1 - p}"/>
    ${[70, 90, 110, 130].map((v, i) => `<path class="draw" d="M${v} 50 V28 M${v} 150 V172 M50 ${v} H28 M150 ${v} H172" stroke="var(--gold)" stroke-width="5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1 - clamp(p * 1.4 - i * .1)}"/>`).join("")}
    <text x="100" y="116" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="46" fill="var(--sand)" opacity="${clamp(p * 2 - 1)}">AI</text>
    <circle cx="100" cy="100" r="${60 + 40 * ((t * .8) % 1)}" fill="none" stroke="var(--sand)" stroke-width="2" opacity="${(1 - (t * .8) % 1) * .6 * p}"/>`,
  towers: (p, t) => [[40, 120], [85, 80], [130, 40]].map(([x, h], i) => { const hh = h * out(p * 1.5 - i * .2) + 20; return `<rect x="${x}" y="${170 - hh}" width="34" height="${hh}" rx="5" fill="${["var(--red2)", "var(--rose)", "var(--sand)"][i]}"/>`; }).join("")
    + `<path class="draw" d="M30 150 L80 110 L110 125 L170 50" stroke="var(--gold)" stroke-width="7" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1 - clamp(p * 1.3 - .2)}"/><path class="draw" d="M145 50 H170 V75" stroke="var(--gold)" stroke-width="7" opacity="${clamp(p * 3 - 2)}"/>`,
  steady: (p, t) => `<path class="draw" d="M20 120 C60 112, 90 118, 120 108 S170 96, 185 92" stroke="var(--sand)" stroke-width="7" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1 - p}"/>`
    + [0, 1, 2, 3].map((i) => `<ellipse cx="70" cy="${165 - i * 16 * out(p * 1.5 - i * .15)}" rx="38" ry="12" fill="var(--gold)" stroke="var(--navy)" stroke-width="3" opacity="${clamp(p * 3 - i * .3)}"/>`).join("")
    + `<circle cx="150" cy="150" r="28" fill="none" stroke="var(--rose)" stroke-width="5" opacity="${clamp(p * 2 - .6)}"/><text x="150" y="162" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="34" fill="var(--rose)" opacity="${clamp(p * 2 - .6)}">R</text>`,
  turbine: (p, t) => `<path d="M100 100 L92 190 H108 Z" fill="var(--mist)" opacity="${clamp(p * 2)}"/>
    <g transform="rotate(${t * 120} 100 100)" opacity="${clamp(p * 2 - .3)}">${[0, 120, 240].map((a) => `<path d="M100 100 C96 70, 98 40, 104 18 C110 40, 108 70, 100 100Z" fill="var(--sand)" transform="rotate(${a} 100 100)"/>`).join("")}<circle cx="100" cy="100" r="9" fill="var(--gold)"/></g>
    <path class="draw" d="M20 190 H180" stroke="var(--gold)" stroke-width="5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1 - p}"/>`,
  gem: (p, t) => `<path class="draw" d="M50 70 L75 40 H125 L150 70 L100 160 Z M50 70 H150 M75 40 L90 70 L100 160 L110 70 L125 40" stroke="var(--sand)" stroke-width="6" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1 - p}"/>
    <path d="M50 70 L75 40 H125 L150 70 L100 160 Z" fill="var(--gold)" opacity="${clamp(p * 2 - 1) * .35}"/>
    ${[[40, 40], [160, 50], [150, 150]].map(([x, y], i) => `<path d="M${x} ${y - 12} V${y + 12} M${x - 12} ${y} H${x + 12}" fill="none" stroke="var(--sand)" stroke-width="4" stroke-linecap="round" opacity="${(Math.sin(t * 4 + i * 2) * .5 + .5) * clamp(p * 2 - 1)}"/>`).join("")}`,
  curve: (p, t) => `<path class="draw" d="M30 30 V170 H180" stroke="var(--mist)" stroke-width="5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1 - clamp(p * 2)}"/>
    <path class="draw" d="M30 165 C90 160, 130 140, 175 35" stroke="var(--sand)" stroke-width="8" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1 - clamp(p * 1.5 - .3)}"/>
    <path class="draw" d="M30 165 C90 162, 130 155, 175 130" stroke="var(--red2)" stroke-width="6" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1 - clamp(p * 1.5 - .3)}"/>`,
  crash: (p, t) => `<path class="draw" d="M30 30 V170 H180" stroke="var(--mist)" stroke-width="5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1 - clamp(p * 2)}"/>
    <path class="draw" d="M35 50 L65 70 L85 60 L110 110 L130 95 L170 160" stroke="var(--rose)" stroke-width="8" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1 - clamp(p * 1.4 - .2)}"/>
    <path class="draw" d="M150 160 H172 V138" stroke="var(--rose)" stroke-width="8" opacity="${clamp(p * 3 - 2)}"/>`,
  shield: (p, t) => `<path class="draw" d="M100 25 L165 50 V100 C165 140, 135 165, 100 180 C65 165, 35 140, 35 100 V50 Z" stroke="var(--sand)" stroke-width="7" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1 - p}"/>
    <path d="M100 25 L165 50 V100 C165 140, 135 165, 100 180 C65 165, 35 140, 35 100 V50 Z" fill="var(--gold)" opacity="${clamp(p * 2 - 1) * .25}"/>
    <path class="draw" d="M70 100 L92 122 L135 78" stroke="var(--sand)" stroke-width="9" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1 - clamp(p * 2 - 1)}"/>`,
  pie: (p, t) => { const segs = [.25, .15, .2, .15, .25], cols = ["var(--red2)", "var(--rose)", "var(--sand)", "var(--mist)", "var(--gold)"]; let a0 = -Math.PI / 2, s = ""; const tot = out(p * 1.2);
    segs.forEach((f, i) => { const a1 = a0 + f * Math.PI * 2 * tot; const r = 80, cx = 100, cy = 100; const large = a1 - a0 > Math.PI ? 1 : 0;
      s += `<path d="M${cx} ${cy} L${cx + r * Math.cos(a0)} ${cy + r * Math.sin(a0)} A${r} ${r} 0 ${large} 1 ${cx + r * Math.cos(a1)} ${cy + r * Math.sin(a1)} Z" fill="${cols[i]}" stroke="var(--navy)" stroke-width="4"/>`; a0 = a1; });
    return s; },
  sunrise: (p, t) => { const rise = 60 * (1 - out(p)); return `<g transform="translate(0 ${rise})" opacity="${clamp(p * 2)}"><circle cx="100" cy="130" r="48" fill="var(--sand)"/>${[...Array(9)].map((_, i) => { const a = Math.PI + i * Math.PI / 8; return `<path d="M${100 + 62 * Math.cos(a)} ${130 + 62 * Math.sin(a)} L${100 + 82 * Math.cos(a)} ${130 + 82 * Math.sin(a)}" stroke="var(--gold)" stroke-width="6" stroke-linecap="round"/>`; }).join("")}</g>
    <rect x="0" y="130" width="200" height="80" fill="var(--navy2)"/><path class="draw" d="M15 130 H185" stroke="var(--gold)" stroke-width="6" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1 - p}"/>`; },
  rand: (p, t) => `<circle class="draw" cx="90" cy="110" r="60" stroke="var(--sand)" stroke-width="8" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1 - p}"/>
    <text x="90" y="136" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="76" fill="var(--sand)" opacity="${clamp(p * 2 - .5)}">R</text>
    <path class="draw" d="M160 120 V${40 - 6 * Math.sin(t * 3)} M140 ${60 - 6 * Math.sin(t * 3)} L160 ${40 - 6 * Math.sin(t * 3)} L180 ${60 - 6 * Math.sin(t * 3)}" stroke="var(--gold)" stroke-width="8" opacity="${clamp(p * 2 - 1)}"/>`,
  globe: (p, t) => `<circle class="draw" cx="100" cy="100" r="70" stroke="var(--sand)" stroke-width="6" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1 - p}"/>
    ${[20, 45].map((rx) => `<ellipse cx="100" cy="100" rx="${rx * Math.abs(Math.cos(t * .8)) + 4}" ry="70" fill="none" stroke="var(--gold)" stroke-width="4" opacity="${clamp(p * 2 - .5)}"/>`).join("")}
    <path d="M30 100 H170 M42 65 H158 M42 135 H158" stroke="var(--gold)" stroke-width="4" opacity="${clamp(p * 2 - .5)}"/>`,
  piggy: (p, t) => `<ellipse class="draw" cx="95" cy="110" rx="65" ry="48" stroke="var(--sand)" stroke-width="7" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1 - p}"/>
    <path class="draw" d="M55 150 V172 M120 150 V172 M160 104 C172 100, 176 110, 168 116" stroke="var(--sand)" stroke-width="7" opacity="${clamp(p * 2 - .5)}"/>
    <path d="M70 66 L62 44 L88 60 Z" fill="var(--sand)" opacity="${clamp(p * 2 - .5)}"/><circle cx="120" cy="98" r="5" fill="var(--sand)" opacity="${clamp(p * 2 - .5)}"/>
    <rect x="80" y="${52 - 8 * clamp(p * 2 - 1)}" width="30" height="7" rx="3" fill="var(--navy)" stroke="var(--sand)" stroke-width="4" opacity="${clamp(p * 2 - .6)}"/>
    <g transform="translate(0 ${-40 + 90 * ((t * .6) % 1)})" opacity="${clamp(p * 2 - 1) * (1 - (t * .6) % 1)}"><circle cx="95" cy="0" r="14" fill="var(--gold)"/><text x="95" y="7" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="18" fill="var(--navy)">R</text></g>`,
  cart: (p, t) => `<path class="draw" d="M20 40 H48 L70 135 H160 L178 70 H58" stroke="var(--sand)" stroke-width="7" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1 - p}"/>
    <circle cx="82" cy="160" r="12" fill="var(--gold)" opacity="${clamp(p * 2 - .4)}"/><circle cx="148" cy="160" r="12" fill="var(--gold)" opacity="${clamp(p * 2 - .4)}"/>
    ${[[80, 0], [108, 1], [136, 2]].map(([x, i]) => `<rect x="${x}" y="${120 - 40 * out(p * 1.6 - .4 - i * .15)}" width="22" height="${40 * out(p * 1.6 - .4 - i * .15)}" rx="3" fill="${["var(--red2)", "var(--rose)", "var(--sand)"][i]}"/>`).join("")}`,
  iou: (p, t) => `<rect class="draw" x="40" y="30" width="120" height="150" rx="12" stroke="var(--sand)" stroke-width="7" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1 - p}"/>
    <path d="M62 62 H138 M62 86 H120 M62 110 H130" stroke="var(--mist)" stroke-width="6" stroke-linecap="round" opacity="${clamp(p * 2 - .5)}"/>
    <circle cx="140" cy="150" r="30" fill="var(--gold)" opacity="${clamp(p * 2 - 1)}"/><text x="140" y="160" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="28" fill="var(--navy)" opacity="${clamp(p * 2 - 1)}">+%</text>`,
  building: (p, t) => `<path class="draw" d="M35 180 V70 L100 30 L165 70 V180 Z" stroke="var(--sand)" stroke-width="7" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1 - p}"/>
    ${[0, 1, 2].flatMap((r) => [0, 1, 2].map((c) => `<rect x="${55 + c * 32}" y="${82 + r * 28}" width="20" height="16" rx="2" fill="${(r + c + Math.floor(t * 2)) % 3 === 0 ? "var(--sand)" : "var(--navy3)"}" opacity="${clamp(p * 2 - .6)}"/>`)).join("")}
    <rect x="86" y="150" width="28" height="30" fill="var(--gold)" opacity="${clamp(p * 2 - .8)}"/>`,
  bank: (p, t) => `<path class="draw" d="M25 70 L100 28 L175 70 Z M35 175 H165 M45 160 H155" stroke="var(--sand)" stroke-width="7" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1 - p}"/>
    ${[55, 85, 115, 145].map((x, i) => `<rect x="${x - 6}" y="80" width="12" height="${75 * out(p * 1.6 - .3 - i * .1)}" rx="3" fill="var(--mist)"/>`).join("")}`,
  worldiou: (p, t) => `<circle class="draw" cx="80" cy="95" r="55" stroke="var(--sand)" stroke-width="6" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1 - p}"/>
    <ellipse cx="80" cy="95" rx="${22 * Math.abs(Math.cos(t * .8)) + 3}" ry="55" fill="none" stroke="var(--gold)" stroke-width="4" opacity="${clamp(p * 2 - .5)}"/><path d="M25 95 H135" stroke="var(--gold)" stroke-width="4" opacity="${clamp(p * 2 - .5)}"/>
    <rect x="110" y="100" width="70" height="85" rx="8" fill="var(--navy2)" stroke="var(--rose)" stroke-width="6" opacity="${clamp(p * 2 - .8)}"/><path d="M124 125 H166 M124 145 H158 M124 165 H162" stroke="var(--rose)" stroke-width="5" stroke-linecap="round" opacity="${clamp(p * 2 - .8)}"/>`,
  bars: (p, t) => [[30, 140, 0], [100, 140, 1], [65, 95, 2]].map(([x, y, i]) => { const d = 30 * (1 - out(p * 1.5 - i * .25)); return `<path d="M${x} ${y - d + 40} L${x + 15} ${y - d} H${x + 60} L${x + 75} ${y - d + 40} Z" fill="${["var(--gold)", "var(--sand)", "var(--gold)"][i]}" stroke="var(--navy)" stroke-width="3" opacity="${clamp(p * 2.5 - i * .4)}"/>`; }).join("")
    + [[40, 50], [160, 60], [100, 30]].map(([x, y], i) => `<path d="M${x} ${y - 10} V${y + 10} M${x - 10} ${y} H${x + 10}" fill="none" stroke="var(--sand)" stroke-width="4" stroke-linecap="round" opacity="${(Math.sin(t * 4 + i * 2) * .5 + .5) * clamp(p * 2 - 1)}"/>`).join(""),
  scales: (p, t) => { const a = Math.sin(t * 1.4) * 8 * clamp(p * 2 - .5); return `<path class="draw" d="M100 30 V170 M65 175 H135" stroke="var(--mist)" stroke-width="7" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1 - clamp(p * 2)}"/>
    <g transform="rotate(${a} 100 50)" opacity="${clamp(p * 2 - .4)}"><path d="M30 50 H170" stroke="var(--sand)" stroke-width="7" stroke-linecap="round"/>
      <path d="M30 50 L12 100 H48 Z" fill="none" stroke="var(--sand)" stroke-width="4"/><path d="M170 50 L152 100 H188 Z" fill="none" stroke="var(--sand)" stroke-width="4"/>
      <text x="30" y="128" text-anchor="middle" font-family="Oswald" font-size="22" fill="var(--rose)">RISK</text><text x="170" y="128" text-anchor="middle" font-family="Oswald" font-size="22" fill="var(--gold)">RETURN</text></g>`; },
  phone: (p, t) => `<rect class="draw" x="55" y="15" width="90" height="170" rx="16" stroke="var(--sand)" stroke-width="7" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1 - p}"/>
    <g transform="translate(62 55) scale(1.02)" style="color:var(--sand)" opacity="${clamp(p * 2 - .6)}">${ICONS.qr()}</g>
    <path d="M88 165 H112" stroke="var(--sand)" stroke-width="6" stroke-linecap="round" opacity="${clamp(p * 2 - .6)}"/>`,
  qr: () => { let s = ""; const pat = [[0, 0], [5, 0], [0, 5]]; pat.forEach(([x, y]) => { s += `<rect x="${x * 10 + 5}" y="${y * 10 + 5}" width="25" height="25" fill="none" stroke="currentColor" stroke-width="5"/><rect x="${x * 10 + 13}" y="${y * 10 + 13}" width="9" height="9" fill="currentColor"/>`; });
    [[6, 6], [7, 4], [4, 7], [7, 7], [5, 5]].forEach(([x, y]) => s += `<rect x="${x * 10}" y="${y * 10}" width="8" height="8" fill="currentColor"/>`); return s; },
};

function setup(cfg) {
  CFG = cfg;
  document.getElementById("chapK").textContent = cfg.n ? `CHAPTER ${cfg.n} OF 4` : "INVESTING 101";
  if (cfg.qr) document.getElementById("cqrImg").src = cfg.qr;
  document.getElementById("run").textContent = cfg.ticker;
}

function buildScene(i) {
  const s = CFG.scenes[i], el = document.getElementById("scene");
  const F = s.from ?? CFG.from, Y = s.to ?? CFG.year;
  if (s.type === "travel") el.innerHTML = `<div class="layer travel"><div class="sub" id="tSub">CHAPTER ${s.chapN ?? CFG.n} - ${Y - F} YEARS LATER</div><div class="num" id="tNum"></div><div class="ttl" id="tTtl">${s.title ?? CFG.title}</div></div>`;
  if (s.type === "news") el.innerHTML = `<div class="layer news"><div><div id="nk"><span class="kick">${s.kicker}</span><span class="dt">${s.yr ?? CFG.year}</span></div><div class="head" id="nh">${s.head}</div><div class="sub2" id="ns">${s.sub}</div></div><div class="iconbox" id="ib"><svg viewBox="0 0 200 200" id="ic"></svg></div></div>`;
  if (s.type === "title") el.innerHTML = `<div class="layer title"><div class="big" id="ttB" style="${s.bigSize ? `font-size:${s.bigSize}px` : ""}">${s.big ?? "INVESTING <span>101</span>"}</div><div class="tag" id="ttT">${s.tag ?? "How money grows - before we travel to the future"}</div></div>`;
  if (s.type === "learn") el.innerHTML = `<div class="layer learn"><div><div id="nk"><span class="kick">${s.kicker}</span></div><div class="head" id="nh">${s.head}</div><div class="sub2" id="ns">${s.sub}</div><div class="ex" id="nx"><b>${s.exLabel || "EVERYDAY EXAMPLE"}</b>${s.ex}</div></div><div class="iconbox" id="ib"><svg viewBox="0 0 200 200" id="ic"></svg></div></div>`;
  if (s.type === "close") el.innerHTML = `<div class="layer close"><div class="its" id="ci">${s.closeKick ?? CFG.closeKick ?? `IT'S ${CFG.from}. YOU'VE SEEN THE FUTURE.`}</div><div class="q" id="cq">${s.q ?? CFG.question}</div><div class="scan" id="cs"><svg viewBox="0 0 75 75" style="color:var(--navy)">${ICONS.qr()}</svg>${s.btn ?? "Scan the QR code"}</div></div>`;
  if (s.type === "grid") el.innerHTML = `<div class="layer grid"><span class="kick" id="nk">${s.kicker}</span><div class="head" id="nh">${s.head}</div><div class="cards" style="grid-template-columns:repeat(${s.items.length},1fr)">${s.items.map((it, k) => `<div class="card" id="gc${k}"><div class="n"><i style="background:${it.c}"></i>${it.n}</div><p>${it.d}</p></div>`).join("")}</div></div>`;
  if (s.type === "enter") el.innerHTML = `<div class="layer enter"><div class="qrbig" id="eq"><img src="${CFG.qr}" alt=""></div><div><div class="k" id="ek">${s.kick}</div><div class="h" id="eh">${s.h}</div><ol id="eo">${s.steps.map((x) => `<li>${x}</li>`).join("")}</ol><div class="url" id="eu">${CFG.url || ""}</div></div></div>`;
}

function drawBg(t, s, lt) {
  const g = ctx.createRadialGradient(960, 480, 100, 960, 540, 1200);
  const dark = (s.mood ?? CFG.mood) === "dark";
  g.addColorStop(0, dark ? "#3a1a22" : "#2c3646"); g.addColorStop(1, "#151c27");
  ctx.fillStyle = g; ctx.fillRect(0, 0, 1920, 1080);
  // grid
  ctx.strokeStyle = "rgba(201,206,214,0.05)"; ctx.lineWidth = 1;
  const off = (t * 20) % 80;
  for (let x = -80 + off; x < 1920; x += 80) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1080); ctx.stroke(); }
  for (let y = -80 + off; y < 1080; y += 80) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1920, y); ctx.stroke(); }
  // particles
  for (const q of P) { const y = (q.y - t * q.s) % 1080; ctx.fillStyle = `rgba(253,205,162,${q.a})`; ctx.beginPath(); ctx.arc(q.x, y < 0 ? y + 1080 : y, q.r, 0, 7); ctx.fill(); }
  // warp streaks during travel
  if (s.type === "travel") {
    const warp = Math.sin(clamp(lt / Math.min(4.5, s.dur)) * Math.PI);
    for (const k of STREAKS) {
      const d = (k.d + lt * k.sp * 0.6) % 1, r0 = 60 + d * 1100, r1 = r0 + 40 + 400 * warp * d;
      ctx.strokeStyle = `rgba(253,205,162,${0.5 * warp * d})`; ctx.lineWidth = k.w;
      ctx.beginPath(); ctx.moveTo(960 + Math.cos(k.ang) * r0, 470 + Math.sin(k.ang) * r0); ctx.lineTo(960 + Math.cos(k.ang) * r1, 470 + Math.sin(k.ang) * r1); ctx.stroke();
    }
  }
}

function frame(t) {
  let i = CFG.scenes.findIndex((s) => t >= s.start && t < s.start + s.dur);
  if (i < 0) i = CFG.scenes.length - 1;
  const s = CFG.scenes[i], lt = t - s.start;
  if (i !== cur) { buildScene(i); cur = i; }
  drawBg(t, s, lt);
  const fadeOut = clamp((s.start + s.dur - t) / 0.4);
  document.getElementById("scene").style.opacity = Math.min(clamp(lt / 0.35), i === CFG.scenes.length - 1 ? 1 : fadeOut);
  // header year
  const F = s.from ?? CFG.from, Y = s.to ?? CFG.year;
  const shownYear = s.type === "travel" ? Math.round(F + (Y - F) * ease((lt - 0.6) / 3.2)) : (s.yr ?? (s.type === "close" ? CFG.from : CFG.year));
  document.getElementById("chapY").textContent = shownYear;
  if (s.hdr) document.getElementById("chapK").textContent = s.hdr;
  const showQR = !!CFG.qr && s.type !== "enter";
  document.getElementById("cqr").style.display = showQR ? "block" : "none";
  // captions
  document.getElementById("cap").innerHTML = `<span>${s.say}</span>`; document.getElementById("cap").className = "cap" + (s.say.length > 230 ? " small" : "") + (showQR ? " withqr" : "");
  document.getElementById("cap").style.opacity = clamp(lt / 0.3) * fadeOut;
  // ticker
  document.getElementById("run").style.transform = `translateX(${-(t * 140) % 2400}px)`;
  if (s.type === "travel") {
    const p = ease((lt - 0.6) / 3.2);
    const n = document.getElementById("tNum"); n.textContent = Math.round(F + (Y - F) * p);
    n.style.transform = `scale(${1 + 0.08 * Math.sin(p * Math.PI)})`; n.style.color = p >= 1 ? "var(--sand)" : "#fff";
    document.getElementById("tSub").style.opacity = clamp(lt / 0.6);
    const tt = document.getElementById("tTtl"); tt.style.opacity = clamp((lt - 3.9) / 0.6); tt.style.transform = `translateY(${30 * (1 - out((lt - 3.9) / 0.6))}px)`;
  }
  if (s.type === "title") {
    const b = document.getElementById("ttB"); b.style.opacity = clamp(lt / 0.6); b.style.transform = `scale(${0.9 + 0.1 * out(lt / 0.9)})`;
    const tg = document.getElementById("ttT"); tg.style.opacity = clamp((lt - 0.8) / 0.6);
  }
  if (s.type === "learn") {
    const a = (id, d) => { const e = document.getElementById(id); e.style.opacity = clamp((lt - d) / 0.5); e.style.transform = `translateX(${-60 * (1 - out((lt - d) / 0.6))}px)`; };
    a("nk", 0.1); a("nh", 0.35); a("ns", 0.9); a("nx", 2.2);
    const ib = document.getElementById("ib"); ib.style.opacity = clamp((lt - 0.4) / 0.5); ib.style.transform = `scale(${0.9 + 0.1 * out((lt - 0.4) / 0.6)})`;
    document.getElementById("ic").innerHTML = ICONS[s.icon](clamp((lt - 0.6) / 2.2), t);
  }
  if (s.type === "news") {
    const a = (id, d) => { const e = document.getElementById(id); e.style.opacity = clamp((lt - d) / 0.5); e.style.transform = `translateX(${-60 * (1 - out((lt - d) / 0.6))}px)`; };
    a("nk", 0.1); a("nh", 0.35); a("ns", 0.9);
    const ib = document.getElementById("ib"); ib.style.opacity = clamp((lt - 0.4) / 0.5); ib.style.transform = `scale(${0.9 + 0.1 * out((lt - 0.4) / 0.6)})`;
    document.getElementById("ic").innerHTML = ICONS[s.icon](clamp((lt - 0.6) / 2.2), t);
  }
  if (s.type === "grid") {
    const a = (id, d) => { const e = document.getElementById(id); e.style.opacity = clamp((lt - d) / 0.5); e.style.transform = `translateY(${30 * (1 - out((lt - d) / 0.6))}px)`; };
    a("nk", 0.1); a("nh", 0.35);
    const n = s.items.length, span = Math.max(2, s.dur - 3);
    s.items.forEach((_, k) => a("gc" + k, 1.0 + k * span / n));
  }
  if (s.type === "enter") {
    const eq = document.getElementById("eq"); eq.style.opacity = clamp(lt / 0.5); eq.style.transform = `scale(${0.9 + 0.1 * out(lt / 0.7)})`;
    ["ek", "eh", "eo", "eu"].forEach((id, k) => { const e = document.getElementById(id); e.style.opacity = clamp((lt - 0.4 - k * 0.35) / 0.5); e.style.transform = `translateX(${40 * (1 - out((lt - 0.4 - k * 0.35) / 0.6))}px)`; });
  }
  if (s.type === "close") {
    const ci = document.getElementById("ci"); ci.style.opacity = clamp(lt / 0.5);
    const cq = document.getElementById("cq"); cq.style.opacity = clamp((lt - 0.5) / 0.6); cq.style.transform = `translateY(${30 * (1 - out((lt - 0.5) / 0.6))}px)`;
    const cs = document.getElementById("cs"); cs.style.opacity = clamp((lt - 1.4) / 0.5); cs.style.transform = `scale(${1 + 0.04 * Math.sin(lt * 4) * clamp(lt - 1.4)})`;
  }
}
</script></body></html>
